[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  { name = "daniele arosio", email = "daniele.arosio@cnr.it" },
]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Unix Shell",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
  "click>=8.5.0",
  "matplotlib>=3.11.2",
  "pandas>=3.1.0",
  "pyarrow>=26.0.0",
  "s3fs>=2026.9.0",
  "scikit-image>=0.26.0",
  "scipy>=1.18.1",
  "sigfig>=1.4.0",
  "dask-image>=2026.5.0",
  "nima-io>=0.4.2",
]
description = "Numerical IMage Analyses."
keywords = ["ClopHensor", "ratio imaging", "image analysis", "chloride", "pH"]
license = "BSD-3-Clause"
name = "nima"
readme = "README.md"
requires-python = ">=3.13"
version = "0.11.9"

[project.optional-dependencies]
docs = [
  "bokeh>=3.10.1",
  "dask-image>=2026.5.0",
  "holoviews>=1.23.2",
  "hvplot>=0.12.2",
  "impy-array>=2.5.3",
  "ipykernel>=7.4.0",
  "jupyter>=1.1.1",
  "myst-nb>=1.4.0",
  "pydata-sphinx-theme>=0.23.0",
  "pygments>=2.21.0",
  "pympler>=1.1",
  "seaborn>=0.13.2",
  "selenium>=4.51.0",
  "sphinx-autoapi>=3.8.1",
  "sphinx-click>=6.2.0",
  "sphinx>=9.2.0",
  "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
  "git-cliff>=2.14.2",
  "mdformat>=1.0.0",
  "mdformat-gfm>=1.0.0",
  "pylsp-mypy>=0.8.2",
  "ruff>=0.17.2",
  "python-lsp-ruff>=2.3.4",
  "cruft>=2.16.0",
]
lint = [
  "pre-commit==4.7.0",
]
tests = [
  "coverage[toml]>=7.17.0",
  "mypy>=2.4.0",
  "pandas-stubs>=3.0.5.260914",
  "pygments>=2.21.0", # color xdoctest
  "pypdf>=6.21.2",
  "pytest>=9.1.1",
  "scipy-stubs>=1.18.1.1",
  "types-click >= 7.1.8",
  "types-setuptools>=84.0.0.20261006",
  "xdoctest>=1.3.2",
]

[project.scripts]
bima = "nima.__main__:bima"
nima = "nima.__main__:main"

[project.urls]
"Bug Tracker" = "https://github.com/darosio/nima/issues"
Changelog = "https://github.com/darosio/nima/blob/main/CHANGELOG.md"
# Discussions = "https://github.com/darosio/nima/discussions"
Documentation = "https://nima.readthedocs.io"
"Github releases" = "https://github.com/darosio/nima/releases"
Homepage = "https://github.com/darosio/nima"
repository = "https://github.com/darosio/nima/"

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
# fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
omit = ["*__init__.py", "types.py"]
source = ["nima"]

[tool.isort]
combine_as_imports = true
force_single_line = false
include_trailing_comma = true
known_first_party = "nima"
line_length = 88 # to match black's default line length
multi_line_output = 3
profile = "black"

[tool.mypy]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# exclude = ""
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict = true
warn_unreachable = true
warn_unused_configs = true

# TODO: check
[tool.pydoclint]
check-class-attributes = false

[tool.pylsp-mypy]
dmypy = false
enabled = true
live_mode = true
strict = true

[tool.ruff]
extend-exclude = ["scripts/"]
extend-include = ["*.ipynb"]
fix = true
force-exclude = true
line-length = 88
target-version = "py313"
unsafe-fixes = true
# Enable preview mode
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# S311 Standard pseudo-random generators are not suitable for cryptographic purposes
ignore = ["COM", "CPY", "DOC201", "ISC001", "PLR6301", "PLR0914", "PLR0917", "S311", "T20"]
select = [
  "A", # builtins
  "AIR", # airflow
  "ANN", # typing annotation
  "ARG", # unused arguments
  "ASYNC",
  "B", # bugbear
  "BLE", # blind-except
  "C",
  "C4", # comprehensions
  "C90", # mccabe
  "D", # pydocstyle
  "DOC",
  "DTZ", # dates
  "E", # pycodestyle
  "EM", # exceptions
  "ERA", # eradicate
  "EXE",
  "F", # pyflakes
  "FA", # future annotations
  "FBT", # boolean-trap
  "FLY", # flyntp
  "FURB", # refurbishing and modernizing
  "G", # logging
  "I", # isort
  "ICN", # import conventions (opinionated)
  "INP", #inplict namespace
  "INT", #gettext
  "ISC", # implicit-str-concat
  "LOG", # logging
  "N", # pep8-naming
  "NPY",
  "PD", # pandas-vet
  "PERF", # pperformance anti pattern
  "PGH", # pygrep WAIT
  "PIE",
  "PL", # pylint see PLR2004...
  "PT", # pytest-style
  "PTH", # use-pathlib
  "PYI", #lint typeshed
  "Q", # quotes
  "RET", # Return
  "RSE", # Raise
  "RUF", # Ruff
  "S", # bandit
  "SIM", # simplify
  "SLF", # private self
  "SLOT", # __slot__
  "T10", # debugger
  "T20", # print
  "TC", # TYPE_CHECKING
  "TCH", # TYPE_CHECKING
  "TID", # tidy-imports
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W", # pycodestyle
  "YTT", # 2020
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["nima"]
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I002"] # don't need annotations
"docs/*" = ["INP"]
"*.ipynb" = ["ANN001", "ANN201", "D103", "DOC", "ERA", "PD901", "PD013", "E501", "PLR2004", "SLF", "T20", "B018"]
"tests/*" = ["PLR2004", "RUF069", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  "\"id\":\\s*\"[^\"]+\"", # Ignore specific patterns such as "id": "XXXX" in JSON
  "\"metadata\":\\s*\\{[^}]*\\}", # Ignore all metadata fields inside .ipynb cells
]


[tool.typos.default.extend-words]
ND = "ND"
Nd = "Nd"
OME = "OME"
arange = "arange"
arosio = "Arosio"
generat = "generat"
thr = "thr"
certifi = "certifi"
